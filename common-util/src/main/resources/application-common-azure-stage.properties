resume.http.url=

# Candidate Documents
candidate.attachment.upload.path=/documents/Candidate/candidate_attachments
candidate.attachment.http.url=
candidate.document.upload.path=/documents/Candidate/candidate_doc
candidate.offer.upload.path=/documents/Candidate/candidate_offers

# General Uploads
upload.doc-storage-path=/documents/Candidate
upload.public-base-url=

# Offer Templates
