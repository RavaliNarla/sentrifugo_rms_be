# API Base Paths
# ===================================================================
candidate.api.base.path=/api/v1/candidate
master.api.base.path=/api/v1/master
recruiter.api.base.path=/api/v1/recruiter


# ===================================================================
# CCAvenue Properties
# ===================================================================
ccavenue.workingKey=${v-cc-workingkey}
ccavenue.accessCode=${v-cc-accesscode}
ccavenue.merchantId=${v-cc-merchantid}
ccavenue.redirect.url=${app.base.url}/candidate-portal${candidate.api.base.path}/cc-avenue-order/handleCallback
