# Profile: azure-dev  (Sentrifugo-RM1)
# Activate with: -Dspring.profiles.active=azure-dev
# Nginx terminates HTTPS on rmsapi.sentrifugo.com and proxies /rms/* here over HTTP.
# Vault + Blob always on (rms-common application.properties); set VAULT_ROLE_ID + VAULT_SECRET_ID.

server.port=8085
server.ssl.enabled=false
server.forward-headers-strategy=framework
