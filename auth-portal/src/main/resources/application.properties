spring.application.name=auth-portal
server.port=8085
server.servlet.context-path=/auth-portal

auth.api.base.path=/api/v1/auth

# ===================================================================
# Database
# ===================================================================
spring.datasource.url=jdbc:postgresql://bob-dbserver.postgres.database.azure.com:5432/rms_dev?sslmode=require
spring.datasource.username=pgadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# ===================================================================
# Local JWT (password login) — shared secret across auth/master/recruiter
# ===================================================================
app.jwt.secret=${APP_JWT_SECRET:SentrifugoRmsLocalJwtSecretKey_ChangeMe_32b+}
app.jwt.issuer=sentrifugo-rms
app.jwt.expiry-hours=12

# ===================================================================
# Mail (Gmail SMTP) - password reset OTPs
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=donotreply.bobdev@gmail.com
spring.mail.password=ocwqibrpcbvlswgt
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ===================================================================
# Swagger
# ===================================================================
app.swagger.title=Sentrifugo RMS - Auth Portal API
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

app.name=Sagar Recruitment Hub

logging.level.org.springframework.security=INFO
logging.level.com.sentrifugo.rms=DEBUG
