spring.application.name=auth-portal
server.port=8085
server.servlet.context-path=/auth-portal

# Vault must be imported from the portal jar (not only rms-common) for AppRole secrets.
spring.config.import=classpath:application-rms-vault.properties,optional:vault://

auth.api.base.path=/api/v1/auth

# ===================================================================
# Database (password from Vault: spring.datasource.password)
# ===================================================================
spring.datasource.url=jdbc:postgresql://sentrifugo-db.postgres.database.azure.com:5432/rms_dev?sslmode=require
spring.datasource.username=pgadmin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# ===================================================================
# JWT (secret from Vault: app.jwt.secret)
# ===================================================================
app.jwt.issuer=sentrifugo-rms
app.jwt.expiry-hours=12

# ===================================================================
# Mail (username/password from Vault: spring.mail.username / spring.mail.password)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ===================================================================
# Swagger
# ===================================================================
app.swagger.title=Sentrifugo RMS - Auth Portal API
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

app.name=Sagar Recruitment Hub

logging.level.org.springframework.security=INFO
logging.level.com.sentrifugo.rms=DEBUG
