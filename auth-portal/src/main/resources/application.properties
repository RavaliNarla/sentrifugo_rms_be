spring.application.name=auth-portal
server.port=8085
server.servlet.context-path=/auth-portal

# Vault must be imported from the portal jar (not only rms-common) for AppRole secrets.
spring.config.import=classpath:application-rms-vault.properties,optional:vault://

auth.api.base.path=/api/v1/auth

# ===================================================================
# Database (password from Vault: spring.datasource.password)
# ===================================================================
spring.datasource.url=jdbc:postgresql://sentrifugo-db.postgres.database.azure.com:5432/rms_dev_integrated?sslmode=require
spring.datasource.username=pgadmin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# ===================================================================
# JWT (secret from Vault: app.jwt.secret)
# ===================================================================
app.jwt.issuer=sentrifugo-rms
app.jwt.expiry-hours=12

# ===================================================================
# Mail (username/password from Vault: spring.mail.username / spring.mail.password)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Temporary: password-reset mail is stored in Mailpit and is not delivered.
# Revert MailService to restore real user delivery.
app.mailpit.base-url=http://172.16.2.111:8125

# ===================================================================
# Swagger
# ===================================================================
app.swagger.title=Sentrifugo RMS - Auth Portal API
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

app.name=Sagar Recruitment Hub

logging.level.org.springframework.security=INFO
logging.level.com.sentrifugo.rms=DEBUG

# Same Valkey instance as HRMS IAM. Host is hardcoded so local runs do not need VALKEY_HOST.
spring.data.redis.host=${VALKEY_HOST:172.16.2.111}
spring.data.redis.port=${VALKEY_PORT:6479}
spring.data.redis.database=${VALKEY_DB:0}
spring.data.redis.ssl.enabled=${VALKEY_SSL_ENABLED:false}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s

# Internal IAM. Java on this laptop cannot open https://rmsapi.sentrifugo.com.
hrms.iam.base-url=${HRMS_IAM_BASE_URL:http://172.16.2.111:8000/api/iam}
