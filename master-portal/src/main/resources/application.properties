spring.application.name=master-portal
server.port=8080
server.servlet.context-path=/master-portal

master.api.base.path=/api/v1/master

# ===================================================================
# Database
# ===================================================================
spring.datasource.url=jdbc:postgresql://bob-dbserver.postgres.database.azure.com:5432/rms_dev?sslmode=require
spring.datasource.username=pgadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# ===================================================================
# Azure AD (Entra ID) - same tenant/app registration as the BOB demo
# ===================================================================
azure.ad.tenant-id=f74c48c6-7f19-4f6e-95e9-83c6e1dfdbd0
azure.ad.client-id=cd56da03-d902-480a-9036-2d86da88d54c
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/f74c48c6-7f19-4f6e-95e9-83c6e1dfdbd0/

# ===================================================================
# File storage (local disk, for approval documents uploaded via recruiter-portal
# but served here in case master screens ever need to preview them)
# ===================================================================
app.file-storage.base-path=./uploads/master-portal

# ===================================================================
# Swagger
# ===================================================================
app.swagger.title=Sentrifugo RMS - Master Portal API
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.name=Sentrifugo RMS

logging.level.org.springframework.security=INFO
logging.level.com.sentrifugo.rms=DEBUG
