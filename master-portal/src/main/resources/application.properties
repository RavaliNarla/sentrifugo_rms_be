spring.application.name=master-portal
server.port=8080
server.servlet.context-path=/master-portal

spring.config.import=classpath:application-rms-defaults.properties,classpath:application-rms-vault.properties,optional:vault://

master.api.base.path=/api/v1/master

# ===================================================================
# Database (password from Vault: spring.datasource.password)
# ===================================================================
spring.datasource.url=jdbc:postgresql://sentrifugo-db.postgres.database.azure.com:5432/rms_dev_integrated?sslmode=require
spring.datasource.username=pgadmin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# ===================================================================
# JWT (secret from Vault: app.jwt.secret)
# ===================================================================
app.jwt.issuer=sentrifugo-rms
app.jwt.expiry-hours=12

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# Swagger
# ===================================================================
app.swagger.title=Sentrifugo RMS - Master Portal API
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

app.name=Sentrifugo RMS

logging.level.org.springframework.security=INFO
logging.level.com.sentrifugo.rms=DEBUG
