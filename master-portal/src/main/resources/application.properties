spring.application.name=master-portal
server.port=8080
server.servlet.context-path=/master-portal

master.api.base.path=/api/v1/master

# ===================================================================
# Database
# ===================================================================
spring.datasource.url=jdbc:postgresql://bob-dbserver.postgres.database.azure.com:5432/rms_dev?sslmode=require
spring.datasource.username=pgadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# ===================================================================
# Local JWT (password login) — must match auth-portal app.jwt.secret
# ===================================================================
app.jwt.secret=${APP_JWT_SECRET:SentrifugoRmsLocalJwtSecretKey_ChangeMe_32b+}
app.jwt.issuer=sentrifugo-rms
app.jwt.expiry-hours=12

# ===================================================================
# File storage (local disk, for approval documents uploaded via recruiter-portal
# but served here in case master screens ever need to preview them)
# ===================================================================
app.file-storage.base-path=./uploads/master-portal

# ===================================================================
# Swagger
# ===================================================================
app.swagger.title=Sentrifugo RMS - Master Portal API
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.name=Sentrifugo RMS

logging.level.org.springframework.security=INFO
logging.level.com.sentrifugo.rms=DEBUG
