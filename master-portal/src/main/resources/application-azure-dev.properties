# ===================================================================
# Profile: azure-dev  (bobdev / BOB Java Linux server)
# Activate with: -Dspring.profiles.active=azure-dev
# ===================================================================
# Nginx proxies HTTPS → these ports (see /etc/nginx/sites-available/dev.bobjava...).
# Uses ALTERNATE keystore so original /opt/ssl/dev/keystore.p12 is untouched.

server.port=8089

server.ssl.enabled=true
server.ssl.key-store=file:/opt/ssl/dev/rms-preview-keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=rms-preview
server.forward-headers-strategy=framework

app.file-storage.base-path=/opt/app-jars/uploads/master-portal
