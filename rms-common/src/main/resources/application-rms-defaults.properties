# Comma-separated CORS origin patterns.
# Covers local FE ports, office LAN FE ports, and hosted UI hosts.
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://172.16.2.111:*,https://rms.sentrifugo.com,https://bobdev.recruitment.sentrifugo.com}
