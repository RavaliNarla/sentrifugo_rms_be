# AppRole only: set VAULT_ROLE_ID + VAULT_SECRET_ID (same locally and on the VM).
# Default = Vault on the same machine (apps + Vault share the RMS VM).
# From your laptop: either open a MobaXterm tunnel to server :8200, or set
# VAULT_URI=http://74.224.127.224:8201 after that port is opened (BOB-style).
# KV: secret/data/rms/app

spring.cloud.vault.enabled=true
spring.cloud.vault.uri=${VAULT_URI:http://127.0.0.1:8200}
spring.cloud.vault.authentication=APPROLE
spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID}
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID}
spring.cloud.vault.app-role.app-role-path=approle
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=rms/app
spring.cloud.vault.kv.application-name=rms/app
spring.cloud.vault.kv.version=2
spring.cloud.vault.fail-fast=true

app.file-storage.blob.container=rms
app.file-storage.blob.path-prefix=${spring.application.name}
