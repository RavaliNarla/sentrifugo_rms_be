<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candidate CTC & Negotiation Details</title>

    <style>
        /* Define PDF page size. Reduced side margins to 5mm to maximize width */
        @page {
          size: A4;
          margin: 5mm 5mm;
        }

        body {
          font-family: "Segoe UI", Arial, sans-serif;
          background: #ffffff;
          margin: 0;
          padding: 0;
          color: #333;
        }

        .container {
          width: 100%; /* Maximize width */
          margin: 0;
          background: #fff;
          padding: 0;
          border-radius: 8px;
        }

        .header {
          border: 1px solid #ffb27a;
          background: #fff7f1;
          padding: 10px 14px;
          margin-bottom: 12px;
        }

        .header h2 {
          margin: 0;
          font-size: 20px;
          font-weight: 600;
          color: #ff6a00;
        }

        .header p {
          margin: 6px 0 0;
          font-size: 14px;
          line-height: 1.4;
        }

        /* Table base */
        .my-table {
          border-collapse: collapse;
          width: 100%;
          table-layout: fixed;
          border: 1px solid #999;
        }

        .my-table th {
          background-color: #f4f6f8;
          font-weight: 600;
        }

        .my-table th,
        .my-table td {
          border: 1px solid #999;
          text-align: center;
          vertical-align: middle;
          font-size: 13px;
          padding: 6px 2px;
          word-wrap: break-word;
        }

        /* Rebalanced Column Widths to equal exactly 100% */
       /* Rebalanced Column Widths to equal exactly 100% */
        /* Rebalanced Column Widths to equal exactly 100% */
        .col-fullname {
          width: 15%; /* Shaved 1% to give to negotiation */
        }
        .col-regno {
          width: 15%;
        }
        .col-currctc {
          width: 11%;
        }
        .col-expctc {
          width: 11%;
        }
        .col-hike {
          width: 10%;
        }
        .col-agreedctc {
          width: 11%;
        }
        .col-comments {
          width: 13%; /* Shaved 1% to give to negotiation */
          text-align: left;
          padding-left: 6px;
        }
        .col-negotiation {
          width: 14%; /* Increased by 2% to ensure longer statuses fit */
        }
    </style>
</head>

<body>
<div class="container">
    <div class="header">
        <h2>Candidate CTC Details</h2>
        <p>
            <strong>Requisition Title:</strong>
            <span th:text="${requisitionTitle ?: ''}"></span>
            <br />
            <strong>Applied Position:</strong>
            <span th:text="${positionName ?: ''}"></span>
        </p>
    </div>

    <table class="my-table">
        <thead>
        <tr>
            <th class="col-fullname">Full Name</th>
            <th class="col-regno">Application Number</th>
            <th class="col-currctc">Current CTC</th>
            <th class="col-expctc">Expected CTC</th>
            <th class="col-hike">Expected Hike %</th>
            <th class="col-agreedctc">Agreed CTC</th>
            <th class="col-comments">Comments</th>
            <th class="col-negotiation">Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="candidate : ${compensationPoolDetails}">
            <td
                    class="col-fullname"
                    th:text="${candidate.fullName ?: '-'}"
            ></td>
            <td
                    class="col-regno"
                    th:text="${candidate.applicationNo ?: '-'}"
            ></td>
            <td
                    class="col-currctc"
                    th:text="${candidate.currentCtc ?: '-'}"
            ></td>
            <td
                    class="col-expctc"
                    th:text="${candidate.expectedCtc ?: '-'}"
            ></td>
            <td
                    class="col-hike"
                    th:text="${candidate.hike ?: '-'}"
            ></td>
            <td
                    class="col-agreedctc"
                    th:text="${candidate.agreedCtc ?: '-'}"
            ></td>
            <td
                    class="col-comments"
                    th:text="${candidate.comments ?: '-'}"
            ></td>
            <td
                    class="col-negotiation"
                    th:text="${candidate.negotiation ?: '-'}"
            ></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
