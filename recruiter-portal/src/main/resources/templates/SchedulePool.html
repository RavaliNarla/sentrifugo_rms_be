<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule Pool Details</title>

    <style>
        /* A4 page size with minimal margins */
        @page {
            size: A4;
            margin: 5mm;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #ffffff;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            width: 100%;
            margin: 0;
            background: #fff;
            padding: 0;
            border-radius: 8px;
        }

        .header {
            border: 1px solid #ffb27a;
            background: #fff7f1;
            padding: 10px 14px;
            margin-bottom: 12px;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: #ff6a00;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 14px;
            line-height: 1.4;
        }

        .my-table {
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
            border: 1px solid #999;
        }

        .my-table th {
            background-color: #f4f6f8;
            font-weight: 600;
        }

        .my-table th,
        .my-table td {
            border: 1px solid #999;
            text-align: center;
            vertical-align: middle;
            font-size: 13px;
            padding: 6px 2px;
            word-wrap: break-word;
        }

        /* Adjusted Column Widths to total 100% */
        .col-position { width: 16%; }
        .col-name     { width: 15%; }
        .col-regno    { width: 15%; }
        .col-date     { width: 12%; }
        .col-time     { width: 10%; }
        .col-zone     { width: 10%; }
        .col-panel    { width: 10%; }
        .col-status   { width: 12%; }

    </style>

</head>

<body>
<div class="container">

    <div class="header">
        <h2>Schedule Pool Details</h2>
        <p>
            <strong>Requisition Title:</strong>
            <span th:text="${requisitionTitle ?: '-'}"></span>
        </p>
    </div>

    <table class="my-table">
        <thead>
        <tr>
            <th class="col-position">Applied Position</th>
            <th class="col-name">Full Name</th>
            <th class="col-regno">Application Number</th>
            <th class="col-date">Interview Date</th>
            <th class="col-time">Interview Time</th>
            <th class="col-zone">Zone</th>
            <th class="col-panel">Panel Details</th>
            <th class="col-status">Schedule Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="candidate : ${schedulePoolDetails}">
            <td class="col-position" th:text="${candidate.positionName ?: positionName ?: '-'}"></td>
            <td class="col-name" th:text="${candidate.fullName ?: '-'}"></td>
            <td class="col-regno" th:text="${candidate.applicationNo ?: '-'}"></td>
            <td class="col-date" th:text="${candidate.interviewDate ?: '-'}"></td>
            <td class="col-time" th:text="${candidate.interviewTime ?: '-'}"></td>
            <td class="col-zone" th:text="${candidate.zone ?: '-'}"></td>
            <td class="col-panel" th:text="${candidate.panelDetails ?: '-'}"></td>
            <td class="col-status" th:text="${candidate.scheduleStatus ?: '-'}"></td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
