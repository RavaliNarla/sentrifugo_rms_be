# Profile: azure-dev  (Sentrifugo-RM1)
# Activate with: -Dspring.profiles.active=azure-dev
# Nginx terminates HTTPS on rmsapi.sentrifugo.com and proxies /rms/* here over HTTP.

server.port=8093
server.ssl.enabled=false
server.forward-headers-strategy=framework

app.base.url=https://rmsapi.sentrifugo.com/rms/recruiter-portal
ui.base.url=https://rms.sentrifugo.com/rms

app.file-storage.base-path=/opt/app-jars/uploads/recruiter-portal
