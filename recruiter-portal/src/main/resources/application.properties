spring.application.name=recruiter-portal
server.port=8086
server.servlet.context-path=/recruiter-portal

recruiter.api.base.path=/api/v1/recruiter

# ===================================================================
# Database
# ===================================================================
spring.datasource.url=jdbc:postgresql://bob-dbserver.postgres.database.azure.com:5432/rms_dev?sslmode=require
spring.datasource.username=pgadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# ===================================================================
# Azure AD (Entra ID) - same tenant/app registration as the BOB demo
# ===================================================================
azure.ad.tenant-id=f74c48c6-7f19-4f6e-95e9-83c6e1dfdbd0
azure.ad.client-id=cd56da03-d902-480a-9036-2d86da88d54c
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/f74c48c6-7f19-4f6e-95e9-83c6e1dfdbd0/

# ===================================================================
# Mail (Gmail SMTP) - offer emails with Accept/Reject links
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=donotreply.bobdev@gmail.com
spring.mail.password=ocwqibrpcbvlswgt
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ===================================================================
# File storage (local disk)
# ===================================================================
app.file-storage.base-path=./uploads/recruiter-portal
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# App URLs - used to build the offer accept/reject links in emails
# ===================================================================
app.base.url=http://localhost:8086/recruiter-portal
ui.base.url=http://localhost:3000

# ===================================================================
# Swagger
# ===================================================================
app.swagger.title=Sentrifugo RMS - Recruiter Portal API
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

app.name=Sentrifugo RMS

logging.level.org.springframework.security=INFO
logging.level.com.sentrifugo.rms=DEBUG
