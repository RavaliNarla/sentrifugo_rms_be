spring.application.name=recruiter-portal
server.port=8086
server.servlet.context-path=/recruiter-portal

spring.config.import=classpath:application-rms-vault.properties,optional:vault://

recruiter.api.base.path=/api/v1/recruiter

# ===================================================================
# Database (password from Vault: spring.datasource.password)
# ===================================================================
spring.datasource.url=jdbc:postgresql://sentrifugo-db.postgres.database.azure.com:5432/rms_dev_integrated?sslmode=require
spring.datasource.username=pgadmin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# ===================================================================
# JWT (secret from Vault: app.jwt.secret)
# ===================================================================
app.jwt.issuer=sentrifugo-rms
app.jwt.expiry-hours=12

# ===================================================================
# Mail (username/password from Vault: spring.mail.username / spring.mail.password)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Temporary: recruiter, approver, and other user mail is stored in Mailpit and is not delivered.
# Candidate mail still uses spring.mail above. Revert MailService to restore real user delivery.
app.mailpit.base-url=http://172.16.2.111:8125

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# App URLs - used to build the offer accept/reject links in emails
# ===================================================================
app.base.url=http://localhost:8086/recruiter-portal
ui.base.url=http://localhost:3000

# ===================================================================
# Swagger
# ===================================================================
app.swagger.title=Sentrifugo RMS - Recruiter Portal API
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

app.name=Sentrifugo RMS
app.company.name=Sagar Cements Limited

logging.level.org.springframework.security=INFO
logging.level.com.sentrifugo.rms=DEBUG
